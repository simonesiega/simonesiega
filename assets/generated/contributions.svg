<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 166" role="img" aria-labelledby="contribution-title contribution-desc">
  <title id="contribution-title">simonesiega GitHub contribution summary for the last 365 complete UTC days</title>
  <desc id="contribution-desc">818 contributions across 161 active days from 2025-08-03 through 2026-08-02. The best Monday-anchored week had 102 contributions. Figures reflect contribution data available to the token used for generation.</desc>
  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-variant-numeric: tabular-nums;
    }
    .primary { fill: #171717; }
    .secondary { fill: #737373; }
    .baseline { stroke: #e5e5e5; }
    .trend { fill: none; stroke: #3f3f46; }
    .trend-fill { fill: #3f3f46; opacity: 0.06; }
    .total { font-size: 46px; font-weight: 620; letter-spacing: -1.8px; }
    .metric { font-size: 23px; font-weight: 560; letter-spacing: -0.6px; }
    .label { font-size: 11px; font-weight: 450; }

    /* Tell the story in order: each statistic, the timeline, then the signal. */
    .stat-reveal { animation: stat-in 520ms cubic-bezier(.22, 1, .36, 1) both; }
    .stat-1 { animation-delay: 120ms; }
    .stat-2 { animation-delay: 600ms; }
    .stat-3 { animation-delay: 1080ms; }
    .month-reveal { animation: month-in 360ms ease-out both; }
    .month-1 { animation-delay: 1620ms; }
    .month-2 { animation-delay: 1720ms; }
    .month-3 { animation-delay: 1820ms; }
    .month-4 { animation-delay: 1920ms; }
    .month-5 { animation-delay: 2020ms; }
    .graph-clip {
      transform-box: fill-box;
      transform-origin: left center;
      animation: graph-sweep 3000ms cubic-bezier(.4, 0, .2, 1) 2500ms both;
    }

    @keyframes stat-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes month-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes graph-sweep {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f5f5f5; }
      .secondary { fill: #a3a3a3; }
      .baseline { stroke: #303030; }
      .trend { stroke: #d4d4d4; }
      .trend-fill { fill: #d4d4d4; opacity: 0.07; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stat-reveal, .month-reveal, .graph-clip { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="graph-reveal" clipPathUnits="userSpaceOnUse">
      <rect x="29" y="85" width="562" height="56" class="graph-clip" />
    </clipPath>
  </defs>

  <g class="stat-reveal stat-1">
    <text x="30" y="59" class="primary total">818</text>
    <text x="30" y="78" class="secondary label">contributions in the last year</text>
  </g>

  <g class="stat-reveal stat-2">
    <text x="454" y="51" text-anchor="middle" class="primary metric">161</text>
    <text x="454" y="72" text-anchor="middle" class="secondary label">active days</text>
  </g>
  <g class="stat-reveal stat-3">
    <text x="554" y="51" text-anchor="middle" class="primary metric">102</text>
    <text x="554" y="72" text-anchor="middle" class="secondary label">best week</text>
  </g>

  <g class="months">
    <text x="30.0" y="159" text-anchor="middle" class="secondary label month-reveal month-1">Sep</text>
    <text x="170.0" y="159" text-anchor="middle" class="secondary label month-reveal month-2">Dec</text>
    <text x="310.0" y="159" text-anchor="middle" class="secondary label month-reveal month-3">Mar</text>
    <text x="450.0" y="159" text-anchor="middle" class="secondary label month-reveal month-4">Jun</text>
    <text x="590.0" y="159" text-anchor="middle" class="secondary label month-reveal month-5">Sep</text>
  </g>
