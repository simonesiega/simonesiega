  <title id="contribution-title">simonesiega GitHub contribution summary for the last 365 complete UTC days</title>
  <desc id="contribution-desc">1059 contributions across 195 active days from 2025-09-25 through 2026-09-24. The best Monday-anchored week had 102 contributions. Figures reflect contribution data available to the token used for generation.</desc>
  <style>
