  <title id="contribution-title">simonesiega GitHub contribution summary for the last 365 complete UTC days</title>
  <desc id="contribution-desc">886 contributions across 171 active days from 2025-08-19 through 2026-08-18. The best Monday-anchored week had 102 contributions. Figures reflect contribution data available to the token used for generation.</desc>
  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-variant-numeric: tabular-nums;
    }
    .primary { fill: #171717; }
    .secondary { fill: #737373; }
    .baseline { stroke: #e5e5e5; }
    .trend { fill: none; stroke: #3f3f46; }
    .trend-fill { fill: #3f3f46; opacity: 0.06; }
    .total { font-size: 46px; font-weight: 620; letter-spacing: -1.8px; }
    .metric { font-size: 23px; font-weight: 560; letter-spacing: -0.6px; }
    .label { font-size: 11px; font-weight: 450; }

    .graph-clip {
      transform-box: fill-box;
      transform-origin: left center;
      animation: graph-sweep 2000ms cubic-bezier(.4, 0, .2, 1) both;
    }

    @keyframes graph-sweep {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @media (prefers-color-scheme: dark) {
      .primary { fill: #f5f5f5; }
      .secondary { fill: #a3a3a3; }
      .baseline { stroke: #303030; }
      .trend { stroke: #d4d4d4; }
      .trend-fill { fill: #d4d4d4; opacity: 0.07; }
    }
    @media (prefers-reduced-motion: reduce) {
      .graph-clip { animation: none; }
    }
  </style>

