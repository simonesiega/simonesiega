  <title id="contribution-title">simonesiega GitHub contribution summary for the last 365 complete UTC days</title>
  <desc id="contribution-desc">1035 contributions across 191 active days from 2025-09-17 through 2026-09-16. The best Monday-anchored week had 102 contributions. Figures reflect contribution data available to the token used for generation.</desc>
  <style>
