name: Update profile stats

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run generator tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate contribution graphic
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_stats.py

      - name: Update codex-limits download count
        shell: bash
        run: |
          python - <<'PY'
          import html
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = "https://img.shields.io/npm/dt/@simonesiega/codex-limits?label=total%20downloads"
          request = Request(url, headers={"User-Agent": "simonesiega-profile-stats/1.0"})
          with urlopen(request, timeout=30) as response:
              svg = response.read().decode("utf-8")
          match = re.search(r"<title>total downloads: ([^<]+)</title>", svg)
          if not match:
              raise SystemExit("Could not read the download count from the Shields URL")

          count = html.unescape(match.group(1)).upper()
          path = Path("README.md")
          readme = path.read_text(encoding="utf-8")
          pattern = r"(?<=<!-- codex-downloads:start -->).*?(?=<!-- codex-downloads:end -->)"
          updated, replacements = re.subn(pattern, f"{count}+ downloads", readme)
          if replacements != 1:
              raise SystemExit("Could not find a unique codex downloads marker in README.md")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Verify generated changes
        id: changes
        shell: bash
        run: |
          unexpected="$(
            git status --porcelain=v1 --untracked-files=all |
              while IFS= read -r line; do
                if [[ "${line:3}" != "assets/generated/contributions.svg" && "${line:3}" != "README.md" ]]; then
                  printf '%s\n' "$line"
                fi
              done
          )"

          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed during generation:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain=v1 -- assets/generated/contributions.svg README.md)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Contribution graphic is already current."
          fi

      - name: Commit refreshed profile stats
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git add -- assets/generated/contributions.svg README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh profile stats"
          git push
